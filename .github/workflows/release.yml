# Builds static binaries and attaches them to a GitHub Release.
# Trigger: push a tag that matches the version in Cargo.toml, e.g.
#   git tag v0.0.1 && git push origin v0.0.1
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version v$version"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  upload-binaries:
    name: ${{ matrix.target }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Uses `cross` for the Linux musl targets; archives the binary with the
      # licenses and README, and uploads it with a .sha256 checksum file.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: kadence
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          include: LICENSE-MIT,LICENSE-APACHE,README.md
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
